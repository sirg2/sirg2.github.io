<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <title></title>

    {% set target_url = page.extra.target | default(value=section.extra.target) %}

    <script defer data-domain="lgrunwald.dev"
        src="https://plausible.lgrunwald.dev/js/script.file-downloads.hash.outbound-links.pageview-props.revenue.tagged-events.js"></script>
    <script>window.plausible = window.plausible || function () { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>
    <meta http-equiv="refresh" content="1; url={{ target_url | safe }}">

    <style>
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <script>
        setTimeout(function () {
            // HIER IST DAS UPDATE: replace() statt href =
            window.location.replace("{{ target_url | safe }}");
        }, 200);
    </script>

    <noscript>
        <div style="padding: 2rem; font-family: sans-serif; text-align: center;">
            <a href="{{ target_url | safe }}">Hier klicken zur Weiterleitung</a>
        </div>
    </noscript>
</body>

</html>
