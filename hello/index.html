<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">

    <!-- Zola Logik: Prüfe ob Page oder Section genutzt wird -->
    

    <title>Links &amp; Contact | Luca Grunwald</title>

    <!-- Plausible Tracking -->
    <script defer data-domain="lgrunwald.dev"
        src="https://plausible.lgrunwald.dev/js/script.file-downloads.hash.outbound-links.pageview-props.revenue.tagged-events.js"></script>
    <script>window.plausible = window.plausible || function () { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>
    
    <style>
        :root {
            --bg-color: #f9fafb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --card-hover: #f3f4f6;
            --accent: #0f172a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --card-bg: #1e293b;
                --card-border: #334155;
                --card-hover: #334155;
                --accent: #f8fafc;
            }
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 3rem 1.5rem;
            text-align: center;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1rem;
            border: 3px solid var(--card-border);
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem 0;
        }

        .bio {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0 0 2.5rem 0;
            line-height: 1.5;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-card {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .link-card:hover {
            background-color: var(--card-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .link-icon {
            font-size: 1.5rem;
            margin-right: 1.2rem;
            min-width: 30px;
            text-align: center;
        }

        .link-content {
            text-align: left;
            flex-grow: 1;
        }

        .link-title {
            font-weight: 600;
            font-size: 1.05rem;
            margin: 0;
        }

        .link-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0.25rem 0 0 0;
        }
    </style>
</head>

<body>

    <div class="container">
        
        <img src="&#x2F;assets&#x2F;avatar.png" alt="Profilbild" class="profile-img">
        

        
        <h1>Luca Grunwald</h1>
        

        
        <p class="bio">Dual Student @ Siemens Mobility</p>
        

        <div class="links-container">
            
            
            <a href="&#x2F;" class="link-card">

                
                <div class="link-icon">📝</div>
                

                <div class="link-content">
                    <h2 class="link-title">My Website</h2>
                    
                </div>

            </a>
            
            <a href="&#x2F;go&#x2F;linkedin" class="link-card">

                
                <div class="link-icon">💼</div>
                

                <div class="link-content">
                    <h2 class="link-title">LinkedIn Profil</h2>
                    
                    <p class="link-desc">Let&#x27;s connect on LinkedIn 👋</p>
                    
                </div>

            </a>
            
            <a href="&#x2F;go&#x2F;github" class="link-card">

                
                <div class="link-icon">💻</div>
                

                <div class="link-content">
                    <h2 class="link-title">GitHub</h2>
                    
                </div>

            </a>
            
            
        </div>
    </div>

</body>

</html>
